spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/mandal_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${JDBC_DATABASE_USERNAME:root}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically create schema tables if they don't exist
spring.sql.init.mode=always